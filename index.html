<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1218">
<title>Workout B</title>
<style>
  /* Hallmark · genre: modern-minimal · macrostructure: Stat-Led
   * theme: custom "Instrument" · vibe: dark technical readout, glanceable mid-set
   * paper oklch(15% 0.013 250) · accent oklch(78% 0.155 165) green
   * display: system-ui stack · numerics: system-mono stack (no webfonts — offline-safe)
   * axes: dark paper / grotesk-sans / chromatic-green
   * enrichment: none (app page) · nav: n/a (app chrome) · footer: n/a
   * pre-emit critique: P5 H5 E4 S5 R5 V4
   */
  :root{
    /* — surface ————————————————————————————— */
    --color-paper:      oklch(15% 0.013 250);
    --color-paper-2:    oklch(19% 0.015 250);
    --color-paper-3:    oklch(23% 0.017 250);
    --color-rule:       oklch(31% 0.018 250);
    --color-rule-soft:  oklch(26% 0.016 250);

    /* — ink ————————————————————————————————— */
    --color-ink:        oklch(97% 0.004 250);
    --color-ink-2:      oklch(74% 0.020 250);
    --color-ink-3:      oklch(58% 0.020 250);

    /* — signal ——————————————————————————————— */
    --color-accent:     oklch(78% 0.155 165);
    --color-accent-ink: oklch(18% 0.045 165);
    --color-accent-8:   oklch(78% 0.155 165 / .08);
    --color-accent-16:  oklch(78% 0.155 165 / .16);
    --color-accent-40:  oklch(78% 0.155 165 / .40);
    --color-cue:        oklch(84% 0.128 85);
    --color-cue-8:      oklch(84% 0.128 85 / .08);
    --color-cue-32:     oklch(84% 0.128 85 / .32);
    --color-video:      oklch(64% 0.215 27);
    --color-focus:      oklch(90% 0.085 200);

    /* — image plate (line-art + photos need a light ground) — */
    --color-sheet:      oklch(100% 0 0);

    /* — bar chart ———————————————————————————— */
    --color-bar:        oklch(46% 0.024 250);
    --color-bar-top:    oklch(55% 0.026 250);

    /* — type ————————————————————————————————— */
    --font-ui:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

    --text-2xs: 9.5px;
    --text-xs:  11px;
    --text-sm:  12px;
    --text-md:  13px;
    --text-lg:  14.5px;
    --text-xl:  17px;
    --text-2xl: clamp(21px, 6vw, 27px);
    --text-figure: clamp(29px, 8.6vw, 38px);

    /* — 4pt space scale ——————————————————————— */
    --space-3xs: 2px;
    --space-2xs: 4px;
    --space-xs:  8px;
    --space-sm:  12px;
    --space-md:  16px;
    --space-lg:  24px;
    --space-xl:  32px;

    /* — form ————————————————————————————————— */
    --radius-sm:  6px;
    --radius-md:  8px;
    --radius-lg:  10px;
    --radius-pill: 999px;
    --rule: 1px;

    /* — motion ——————————————————————————————— */
    --ease-out: cubic-bezier(.16,1,.3,1);
    --dur-fast: 120ms;
    --dur-base: 200ms;

    /* — chrome ——————————————————————————————— */
    --safe-t: env(safe-area-inset-top,0px);
    --safe-b: env(safe-area-inset-bottom,0px);
    --bar-h: 44px;
    --nav-h: 62px;
    --chrome-t: calc(var(--bar-h) + var(--safe-t));
    --chrome-b: calc(var(--nav-h) + var(--safe-b));
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;width:100%;overflow:hidden;
    background:var(--color-paper);color:var(--color-ink);
    font-family:var(--font-ui);
    text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}

  :focus-visible{outline:2px solid var(--color-focus);outline-offset:2px;border-radius:var(--radius-sm)}

  /* ---------- persistent top bar ---------- */
  #topbar{position:fixed;top:0;left:0;right:0;height:var(--chrome-t);
    padding:var(--safe-t) var(--space-md) 0;z-index:40;
    display:flex;align-items:center;gap:var(--space-sm);
    background:var(--color-paper);border-bottom:var(--rule) solid var(--color-rule-soft)}
  #topbar .brand{font-size:var(--text-2xs);font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--color-accent);white-space:nowrap}
  #topbar .title{flex:1;min-width:0;text-align:center;font-size:var(--text-sm);font-weight:500;
    color:var(--color-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #topbar .count{font-family:var(--font-num);font-size:var(--text-xs);font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--color-ink-3);white-space:nowrap}

  /* ---------- horizontal swipe track ---------- */
  #track{display:flex;height:100dvh;width:100%;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;scroll-behavior:smooth;
    -ms-overflow-style:none;scrollbar-width:none}
  #track::-webkit-scrollbar{display:none}

  .slide{flex:0 0 100%;width:100%;min-width:0;height:100dvh;
    scroll-snap-align:start;scroll-snap-stop:always;
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .slide::-webkit-scrollbar{display:none}
  .inner{width:100%;max-width:540px;margin:0 auto;
    display:flex;flex-direction:column;
    padding:calc(var(--chrome-t) + var(--space-sm)) var(--space-md)
            calc(var(--chrome-b) + var(--space-md))}
  .inner > *{min-width:0;max-width:100%}

  /* ---------- the fold: everything the user needs mid-set ---------- */
  .fold{display:flex;flex-direction:column;gap:var(--space-sm);
    min-height:calc(100dvh - var(--chrome-t) - var(--chrome-b) - var(--space-lg))}

  /* ---------- exercise header ---------- */
  .ex-head{display:flex;align-items:flex-start;gap:var(--space-sm)}
  .ex-num{flex:0 0 auto;font-family:var(--font-num);font-size:var(--text-sm);font-weight:700;
    font-variant-numeric:tabular-nums;color:var(--color-accent);
    padding-top:var(--space-2xs);letter-spacing:.04em}
  .ex-id{min-width:0;flex:1}
  .ex-id h1{margin:0;font-size:var(--text-2xl);font-weight:650;line-height:1.08;
    letter-spacing:-.02em;overflow-wrap:anywhere}
  .ex-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2xs) var(--space-xs);
    margin-top:var(--space-2xs)}
  .ex-sub{font-size:var(--text-sm);color:var(--color-ink-3);overflow-wrap:anywhere}
  .ex-garmin{display:inline-flex;align-items:baseline;gap:var(--space-2xs);min-width:0;
    font-family:var(--font-num);font-size:var(--text-xs);color:var(--color-ink-2);
    overflow-wrap:anywhere}
  .ex-garmin .tag{flex:0 0 auto;font-family:var(--font-ui);font-size:var(--text-2xs);font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--color-ink-3);
    border:var(--rule) solid var(--color-rule);border-radius:var(--radius-sm);
    padding:1px var(--space-2xs)}

  /* ---------- progress readout ---------- */
  .progress{display:flex;flex-direction:column;gap:var(--space-sm);
    background:var(--color-paper-2);border:var(--rule) solid var(--color-rule);
    border-radius:var(--radius-lg);padding:var(--space-sm)}
  .pg-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-xs);
    padding-bottom:var(--space-xs);border-bottom:var(--rule) solid var(--color-rule-soft)}
  .pg-lbl{font-size:var(--text-2xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--color-ink-3)}
  .trend{flex:0 0 auto;font-family:var(--font-num);font-size:var(--text-xs);font-weight:700;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    color:var(--color-accent);background:var(--color-accent-8);
    border:var(--rule) solid var(--color-accent-40);border-radius:var(--radius-pill);
    padding:var(--space-3xs) var(--space-xs)}

  /* chart — one bar per logged session, final dashed bar is the target */
  .pg-chart{display:flex;align-items:flex-end;gap:var(--space-2xs);height:74px}
  .pg-bar{flex:1 1 0;min-width:0;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:var(--space-2xs)}
  .pg-bar .bw{font-family:var(--font-num);font-size:var(--text-2xs);font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--color-ink-3)}
  .pg-bar .bar{width:100%;max-width:34px;min-height:4px;border-radius:2px 2px 0 0;
    background:linear-gradient(180deg,var(--color-bar-top),var(--color-bar))}
  .pg-bar.next .bw{color:var(--color-accent)}
  .pg-bar.next .bar{background:var(--color-accent-8);
    border:var(--rule) dashed var(--color-accent);border-bottom:none}

  /* history — mono rows so dates and loads column up */
  .pg-hist{display:flex;flex-direction:column;gap:var(--space-3xs)}
  .pg-hist .hl{font-size:var(--text-2xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--color-ink-3);margin-bottom:var(--space-3xs)}
  .pg-hist .row{font-family:var(--font-num);font-size:var(--text-xs);line-height:1.5;
    font-variant-numeric:tabular-nums;color:var(--color-ink-2);
    overflow-wrap:anywhere;padding-left:var(--space-xs);
    border-left:2px solid var(--color-rule)}
  .pg-hist .row .d{color:var(--color-ink-3)}
  .pg-hist .row.now{color:var(--color-ink);font-weight:600;border-left-color:var(--color-accent)}
  .pg-hist .row.now .d{color:var(--color-accent)}

  /* next target — the figure this whole page exists to show */
  .pg-next{background:var(--color-accent-8);border:var(--rule) solid var(--color-accent-40);
    border-radius:var(--radius-md);padding:var(--space-sm)}
  .pg-next .bl{font-size:var(--text-2xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--color-accent)}
  .pg-next .bw{font-family:var(--font-num);font-size:var(--text-figure);font-weight:700;
    line-height:1.05;letter-spacing:-.03em;word-spacing:-.22em;font-variant-numeric:tabular-nums;
    color:var(--color-ink);margin-top:var(--space-3xs);overflow-wrap:anywhere}
  .pg-next .bw.txt{font-family:var(--font-ui);font-size:var(--text-xl);font-weight:600;
    letter-spacing:-.01em;word-spacing:normal;line-height:1.2}
  .pg-next .br{font-size:var(--text-md);color:var(--color-ink-2);margin-top:var(--space-3xs)}
  .pg-next .nt{display:flex;gap:var(--space-xs);align-items:flex-start;
    margin-top:var(--space-xs);padding-top:var(--space-xs);
    border-top:var(--rule) solid var(--color-accent-16);
    font-size:var(--text-sm);line-height:1.45;color:var(--color-ink-2)}
  .pg-next .nt .ic{flex:0 0 auto}

  /* ---------- reference material (below the fold) ---------- */
  .ref{display:flex;flex-direction:column;gap:var(--space-sm);
    margin-top:var(--space-lg);padding-top:var(--space-lg);
    border-top:var(--rule) solid var(--color-rule-soft)}

  .muscles{display:flex;flex-wrap:wrap;gap:var(--space-2xs)}
  .pill{font-size:var(--text-xs);color:var(--color-ink-2);
    border:var(--rule) solid var(--color-rule);border-radius:var(--radius-pill);
    padding:var(--space-3xs) var(--space-xs)}

  .demo{background:var(--color-sheet);border:var(--rule) solid var(--color-rule);
    border-radius:var(--radius-md);padding:var(--space-xs)}
  .demo img{display:block;width:100%;margin:0 auto;aspect-ratio:4/3;max-height:40vh;
    object-fit:contain}

  h2.sec{margin:0;font-size:var(--text-2xs);font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--color-ink-3)}

  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;
    display:flex;flex-direction:column;gap:var(--space-xs)}
  ol.steps li{counter-increment:s;position:relative;padding-left:var(--space-lg);
    font-size:var(--text-lg);line-height:1.45;color:var(--color-ink-2)}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;
    font-family:var(--font-num);font-size:var(--text-xs);font-weight:700;
    color:var(--color-ink-3)}

  .cues{border-left:2px solid var(--color-cue);background:var(--color-cue-8);
    border-radius:0 var(--radius-md) var(--radius-md) 0;padding:var(--space-sm)}
  .cues h2.sec{color:var(--color-cue)}
  .cues ul{margin:var(--space-xs) 0 0;padding-left:var(--space-md);
    display:flex;flex-direction:column;gap:var(--space-xs)}
  .cues li{font-size:var(--text-lg);line-height:1.45;color:var(--color-ink-2)}

  .watch{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs);
    align-self:flex-start;max-width:100%;text-decoration:none;
    font-size:var(--text-md);font-weight:600;color:var(--color-ink);
    background:var(--color-paper-2);border:var(--rule) solid var(--color-rule);
    border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);
    transition:border-color var(--dur-fast) var(--ease-out)}
  .watch .play{color:var(--color-video)}
  .watch:hover{border-color:var(--color-ink-3)}
  .watch:active{background:var(--color-paper-3)}

  /* ---------- bottom slide navigator ---------- */
  #navbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;align-items:center;gap:var(--space-sm);
    padding:var(--space-sm) var(--space-md) calc(var(--space-sm) + var(--safe-b));
    background:var(--color-paper);border-top:var(--rule) solid var(--color-rule-soft)}
  .arrow{flex:0 0 auto;width:56px;height:38px;padding:0;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:var(--text-xl);color:var(--color-ink-2);
    background:var(--color-paper-2);border:var(--rule) solid var(--color-rule);
    border-radius:var(--radius-sm);
    transition:background var(--dur-fast) var(--ease-out)}
  .arrow:active{background:var(--color-paper-3)}
  .arrow[disabled]{opacity:.28;pointer-events:none}
  #dots{flex:1;display:flex;justify-content:center;align-items:center;gap:var(--space-xs)}
  #dots button{width:6px;height:6px;padding:0;border:none;border-radius:var(--radius-pill);
    background:var(--color-rule);cursor:pointer;
    transition:width var(--dur-base) var(--ease-out),background var(--dur-base) var(--ease-out)}
  #dots button.active{width:18px;background:var(--color-accent)}

  /* the smallest phones still in use — tighten the readout, never the body copy */
  @media (max-width:359px){
    :root{--space-sm:9px;--text-figure:25px}
    .ex-id h1{font-size:20px}
    .pg-chart{height:54px}
    .pg-head{padding-bottom:var(--space-3xs);border-bottom:0}
    .pg-hist .row{line-height:1.42}
    .pg-next .nt{margin-top:var(--space-2xs);padding-top:var(--space-2xs)}
  }


  @media (prefers-reduced-motion:reduce){
    #track{scroll-behavior:auto}
    *,*::before,*::after{transition-duration:1ms !important;animation-duration:1ms !important}
  }
</style>
</head>
<body>
  <header id="topbar">
    <span class="brand">Workout&nbsp;B</span>
    <span class="title" id="bar-title"></span>
    <span class="count" id="bar-count"></span>
  </header>

  <main id="track" aria-label="Workout B slideshow"></main>

  <nav id="navbar" aria-label="Slide navigation">
    <button class="arrow prev" id="prev" aria-label="Previous slide">&#8249;</button>
    <div id="dots"></div>
    <button class="arrow next" id="next" aria-label="Next slide">&#8250;</button>
  </nav>

<script>
(function(){
  "use strict";

  // ---------- content model ----------
  var EXERCISES = [
    {
      name:"Hack Squat", garmin:"Barbell Hack Squat", sub:"angled sled machine",
      imgs:"images/hacksquat.png",
      muscles:["quads","glutes","adductors"],
      steps:[
        "Set your shoulders under the pads, back flat against the angled backrest, feet shoulder-width in the middle of the platform.",
        "Release the safety handles and take the weight.",
        "Lower by bending your knees until your thighs are about parallel (or a touch below if comfortable), keeping your whole back pressed into the pad.",
        "Drive back up through your whole foot; don't slam into a hard knee lockout."
      ],
      cues:[
        "Keep your lower back flat on the pad — if your hips curl/round at the bottom, you've gone too deep; shorten the range.",
        "Push through your heels and mid-foot, not your toes.",
        "New machine: first session go light-moderate to learn the depth, then load so 8–12 reps is hard with 1–2 reps left in reserve.",
        "Don't compare the weight to your leg press — the hack squat number will be lower, and that's normal (different leverage)."
      ],
      how:{sets:"3 × 8–12",setsk:"reps",rest:"~2 min",weight:"Find your weight"},
      yt:"https://www.youtube.com/watch?v=0tn5K9NlCfo"
    },
    {
      name:"Overhead Press", garmin:"Overhead Dumbbell Press", sub:"dumbbells, standing",
      imgs:"images/ohp.png",
      muscles:["shoulders","triceps","upper chest","core"],
      steps:[
        "Stand tall, feet shoulder-width, a dumbbell at each shoulder, palms facing forward.",
        "Brace your abs and squeeze your glutes so your lower back doesn't arch.",
        "Press both dumbbells straight up until your arms are fully extended overhead — don't lean back.",
        "Lower under control back to your shoulders."
      ],
      cues:[
        "Dumbbells (not barbell) on purpose: kinder to the shoulder joint and they force more core bracing.",
        "The brace is the whole game — if your lower back arches, you've lost it. Start lighter.",
        "Start around 10–12.5 kg per hand for 6–9 reps."
      ],
      how:{sets:"3 × 6–9",setsk:"reps",rest:"~2 min",weight:"10 kg / hand"},
      yt:"https://www.youtube.com/watch?v=qEwKCR5JCog"
    },
    {
      name:"Seated Cable Row", garmin:"Seated Cable Row", sub:"neutral close grip",
      imgs:"images/row.png",
      muscles:["mid-back","lats","rear delts","biceps"],
      steps:[
        "Use the V-shaped close handle (neutral grip, palms facing). Feet on the plates, slight knee bend, sit tall.",
        "Pull the handle to your lower ribs / belly button, leading with your elbows close to your body.",
        "Squeeze your shoulder blades together at the end, then return under control without slouching forward."
      ],
      cues:[
        "Pull to your lower ribs, not your chest.",
        "Keep your torso roughly upright — don't heave backward; let your back do the work, not momentum.",
        "Start around 30 kg."
      ],
      how:{sets:"3 × 8–10",setsk:"reps",rest:"~90 sec",weight:"~30 kg to start"},
      yt:"https://www.youtube.com/watch?v=sP_4vybjVJs"
    },
    {
      name:"Seated Leg Curl", garmin:"Weighted Leg Curl", sub:"hamstrings",
      imgs:"images/legcurl.png",
      muscles:["hamstrings"],
      steps:[
        "Sit with your back against the pad, legs out over the roller, the roller resting just above your heels / Achilles.",
        "Lock the thigh pad down snug.",
        "Curl your heels down and under toward your butt as far as you can; squeeze.",
        "Return slowly under control — don't let the weight slam back."
      ],
      cues:[
        "This replaced heavy Romanian deadlifts on purpose: it grows the hamstring in a stretched position with almost no load on your spine, and helps protect against the hamstring strains runners get.",
        "The slow lowering (eccentric) is where the benefit is — control it."
      ],
      how:{sets:"3 × 10–12",setsk:"reps",rest:"~90 sec",weight:"~45 kg"},
      yt:"https://www.youtube.com/watch?v=ELOCsoDSmrg"
    },
    {
      name:"Ab Crunch Machine", garmin:"Weighted Crunch", sub:"seated, loadable",
      imgs:"images/abcrunch.png",
      muscles:["abs (rectus abdominis)"],
      steps:[
        "Sit with your back against the pad, hold the handles (or rest your arms on the pads), feet secured.",
        "Crunch by curling your ribcage toward your pelvis — round your upper back, don't just fold at the hips.",
        "Squeeze at the bottom, then return under control; don't let the weight yank you back up."
      ],
      cues:[
        "It's a spinal curl (ribs toward hips), not a hip bend or an arm pull.",
        "Controlled tempo both ways — the slow return is where a lot of the work is.",
        "Loadable on purpose — pick a weight where 10–15 reps is genuinely hard."
      ],
      how:{sets:"3 × 10–15",setsk:"reps",rest:"~60–90 sec",weight:"Find your weight"},
      yt:"https://www.youtube.com/watch?v=_O1xunCfYEM"
    }
  ];

  // ---------- progress log (append one {date,weight,reps} to `history` each session; update `next`) ----------
  // weight:null = bodyweight — set `weightLabel` for display; bar chart renders only from numeric `weight`.
  var PROGRESS = [
    { // Hack Squat — new machine, replaced the Bulgarian split squat
      history:[{date:"6 Aug", weight:87.5, weightLabel:"87.5 kg (ramped 72.5→87.5)", reps:"12, 12, 12"},
               {date:"13 Aug", weight:95, reps:"12, 12, 12"},
               {date:"20 Aug", weight:100, reps:"10, 10, 10"},
               {date:"28 Aug", weight:100, reps:"12, 12, 12"},
               {date:"3 Sep", weight:105, reps:"12, 12, 12"}],
      next:{weight:110, repsLabel:"8–12", note:"Hit 12s at 105 — add to ~110. Stick to the reclined machine."}
    },
    { // Dumbbell Overhead Press
      history:[{date:"24 Jun", weight:10, reps:"8, 8, 4"},
               {date:"9 Jul", weight:10, reps:"10, 10, 7"},
               {date:"16 Jul", weight:10, reps:"9, 9, 9"},
               {date:"23 Jul", weight:10, reps:"10, 10, 10"},
               {date:"30 Jul", weight:12.5, reps:"8, 9, 9"},
               {date:"6 Aug", weight:12.5, reps:"9, 10, 9"},
               {date:"13 Aug", weight:12.5, reps:"11, 11, 8"},
               {date:"20 Aug", weight:15, reps:"6, 6, 6"},
               {date:"28 Aug", weight:15, reps:"7, 7, 7"},
               {date:"3 Sep", weight:15, reps:"8, 8, 5"}],
      next:{weight:15, repsLabel:"build to 9", note:"Climbing (7 → 8) but the last set fatigued to 5 — stay at 15 and chase a solid 9, 9, 9."}
    },
    { // Seated Cable Row
      history:[{date:"24 Jun", weight:30, reps:"8, 8, 8"},
               {date:"9 Jul", weight:33.5, reps:"10, 10, 8"},
               {date:"23 Jul", weight:33.5, reps:"10, 10, 7"},
               {date:"30 Jul", weight:47, reps:"10, 10"},
               {date:"6 Aug", weight:47, reps:"12, 12, 12"},
               {date:"13 Aug", weight:57, reps:"12, 12, 12"},
               {date:"20 Aug", weight:65, reps:"8, 8, 8"},
               {date:"28 Aug", weight:65, reps:"10, 10, 10"},
               {date:"3 Sep", weight:75, reps:"10, 10, 8"}],
      next:{weight:75, repsLabel:"8–10", note:"Machine step was 65→75 — get all 3 sets to 10 at 75, then add."}
    },
    { // Seated Leg Curl
      history:[{date:"24 Jun", weight:45, reps:"8, 8, 8"},
               {date:"9 Jul", weight:42.5, reps:"12, 12, 12"},
               {date:"16 Jul", weight:50, reps:"8, 8, 8"},
               {date:"23 Jul", weight:50, reps:"9, 9, 9"},
               {date:"30 Jul", weight:50, reps:"11, 11, 11"},
               {date:"6 Aug", weight:50, reps:"12, 12, 12"},
               {date:"13 Aug", weight:57, reps:"10, 10, 10"},
               {date:"20 Aug", weight:59, reps:"12, 12, 12"},
               {date:"28 Aug", weight:60, reps:"12, 12, 12"},
               {date:"3 Sep", weight:64, weightLabel:"64 (then 59)", reps:"6 / 12, 12"}],
      next:{weight:64, repsLabel:"build from 6", note:"59 is maxed at 12; the next notch (64) is a big +5 jump — commit to 64 and build the reps up from 6 toward 10–12."}
    },
    { // Ab Crunch Machine — new machine, replaced the ab wheel
      history:[{date:"6 Aug", weight:80, weightLabel:"80 kg (machine max)", reps:"12, 12, 12"},
               {date:"13 Aug", weight:80, weightLabel:"80 kg (max)", reps:"15, 15, 16"},
               {date:"20 Aug", weight:77, weightLabel:"77 kg (new machine)", reps:"8, 8, 8"},
               {date:"28 Aug", weight:77, reps:"9, 9, 9"},
               {date:"3 Sep", weight:77, reps:"10, 10, 10"}],
      next:{weight:77, repsLabel:"build to 12–15", note:"Climbing (9 → 10) — stay at 77 and build toward 12–15."}
    }
  ];

  var track = document.getElementById('track');

  function el(tag, cls, html){var n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n;}

  // ---------- progress readout ----------
  // Four parts, in order: trend badge · weight bar chart · full history · next target.
  function buildProgress(p){
    if(!p) return null;
    // display weight: prefer an explicit weightLabel, else the numeric kg, else bodyweight
    function wdisp(o){ return o.weightLabel ? o.weightLabel : (o.weight!=null ? (o.weight+' kg') : 'BW'); }

    var wrap = el('div','progress');
    var numHist = p.history.filter(function(h){ return h.weight!=null; });
    var lastNumW = numHist.length ? numHist[numHist.length-1].weight : null;

    // 1. label + trend badge (only when the next target is a higher numeric weight than the last logged)
    var head = el('div','pg-head');
    head.appendChild(el('span','pg-lbl','Progress'));
    if(p.next.weight!=null && lastNumW!=null && p.next.weight>lastNumW){
      var delta = Math.round((p.next.weight-lastNumW)*10)/10;
      head.appendChild(el('span','trend','&#9650;&nbsp;+'+delta+'&nbsp;kg'));
    }
    wrap.appendChild(head);

    // 2. weight trend bar chart — only with 2+ numeric-weight sessions; final bar = next target (accent, dashed)
    if(numHist.length>=2){
      var chart = el('div','pg-chart');
      var nextNum = (p.next.weight!=null);
      var maxW = Math.max.apply(null, numHist.map(function(h){ return h.weight; }));
      if(nextNum) maxW = Math.max(maxW, p.next.weight);
      var top = nextNum ? 100 : 88;                       // headroom so a non-numeric next bar can sit taller
      var H = function(w){ return Math.round(24 + (top-24)*(w/maxW)); };
      numHist.forEach(function(h){
        var col = el('div','pg-bar');
        col.appendChild(el('div','bw',String(h.weight)));
        var bar = el('div','bar'); bar.style.height = H(h.weight)+'%';
        col.appendChild(bar);
        chart.appendChild(col);
      });
      var ncol = el('div','pg-bar next');
      var nb = el('div','bar');
      if(nextNum){ ncol.appendChild(el('div','bw',String(p.next.weight))); nb.style.height = H(p.next.weight)+'%'; }
      else { ncol.appendChild(el('div','bw','&#9650;')); nb.style.height = Math.min(100, H(lastNumW)+16)+'%'; }
      ncol.appendChild(nb);
      chart.appendChild(ncol);
      wrap.appendChild(chart);
    }

    // 3. full history list — every logged session, most recent in bold
    //    (skipped entirely for a brand-new exercise, so no empty box renders)
    if(p.history.length){
      var hist = el('div','pg-hist');
      hist.appendChild(el('div','hl','History'));
      p.history.forEach(function(h, i){
        var now = (i === p.history.length-1);
        hist.appendChild(el('div','row'+(now?' now':''),
          '<span class="d">'+h.date+'</span> &middot; '+wdisp(h)+' &times; '+h.reps));
      });
      wrap.appendChild(hist);
    }

    // 4. the figure this page exists to show — next target + coaching note
    var nx = el('div','pg-next');
    var nextIsLabel = (!!p.next.weightLabel || p.next.weight==null);
    nx.appendChild(el('div','bl','Next'));
    nx.appendChild(el('div','bw'+(nextIsLabel?' txt':''), wdisp(p.next)));
    nx.appendChild(el('div','br',p.next.repsLabel));
    if(p.next.note){
      nx.appendChild(el('div','nt','<span class="ic">&#128161;</span><span>'+p.next.note+'</span>'));
    }
    wrap.appendChild(nx);

    return wrap;
  }

  function pad2(n){ return (n<10 ? '0' : '')+n; }

  // ---- exercise slides ----
  EXERCISES.forEach(function(ex, idx){
    var s = el('section','slide');
    s.dataset.title = (idx+1)+". "+ex.name;
    var inner = el('div','inner');

    // — above the fold: which lift, and the numbers —
    var fold = el('div','fold');

    var head = el('div','ex-head');
    head.appendChild(el('span','ex-num',pad2(idx+1)));
    var ident = el('div','ex-id');
    ident.appendChild(el('h1',null,ex.name));
    var meta = el('div','ex-meta');
    if(ex.sub){ meta.appendChild(el('span','ex-sub',ex.sub)); }
    // the watch labels some lifts differently — only worth showing when it differs
    if(ex.garmin && ex.garmin !== ex.name){
      meta.appendChild(el('span','ex-garmin','<span class="tag">Garmin</span>'+ex.garmin));
    }
    if(meta.childNodes.length){ ident.appendChild(meta); }
    head.appendChild(ident);
    fold.appendChild(head);

    var pgCard = buildProgress(PROGRESS[idx]);
    if(pgCard){ fold.appendChild(pgCard); }
    inner.appendChild(fold);

    // — below the fold: reference material —
    var ref = el('div','ref');

    var muscles = el('div','muscles');
    ex.muscles.forEach(function(m){ muscles.appendChild(el('span','pill',m)); });
    ref.appendChild(muscles);

    var demo = el('div','demo');
    var img = el('img'); img.src=ex.imgs; img.alt=ex.name; img.loading="lazy";
    demo.appendChild(img);
    ref.appendChild(demo);

    ref.appendChild(el('h2','sec','How to do it'));
    var ol = el('ol','steps');
    ex.steps.forEach(function(st){ ol.appendChild(el('li',null,st)); });
    ref.appendChild(ol);

    var cues = el('div','cues');
    cues.appendChild(el('h2','sec','Key cues'));
    var ul = el('ul');
    ex.cues.forEach(function(c){ ul.appendChild(el('li',null,c)); });
    cues.appendChild(ul);
    ref.appendChild(cues);

    var a = el('a','watch','<span class="play">&#9654;</span> Watch proper form');
    a.href = ex.yt; a.target = "_blank"; a.rel = "noopener";
    ref.appendChild(a);

    inner.appendChild(ref);
    s.appendChild(inner);
    track.appendChild(s);
  });

  // ---------- navigation ----------
  var slides = Array.prototype.slice.call(track.querySelectorAll('.slide'));
  var N = slides.length;
  var barTitle = document.getElementById('bar-title');
  var barCount = document.getElementById('bar-count');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var dotsWrap = document.getElementById('dots');
  var current = 0;

  var dots = slides.map(function(_, i){
    var b = document.createElement('button');
    b.setAttribute('aria-label','Go to slide '+(i+1));
    b.addEventListener('click', function(){ goTo(i); });
    dotsWrap.appendChild(b);
    return b;
  });

  function render(){
    barTitle.textContent = slides[current].dataset.title;
    barCount.innerHTML = (current+1)+'&thinsp;/&thinsp;'+N;
    dots.forEach(function(d,i){ d.classList.toggle('active', i===current); });
    prevBtn.disabled = current===0;
    nextBtn.disabled = current===N-1;
  }

  function goTo(i){
    i = Math.max(0, Math.min(N-1, i));
    track.scrollTo({left: i*track.clientWidth, behavior:'smooth'});
    // current updates via scroll handler, but set eagerly for snappy UI
    current = i; render();
  }

  // derive current slide from scroll position (handles native swipe)
  var ticking = false;
  track.addEventListener('scroll', function(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var i = Math.round(track.scrollLeft / track.clientWidth);
      if(i !== current){ current = i; render(); }
      ticking = false;
    });
  }, {passive:true});

  prevBtn.addEventListener('click', function(){ goTo(current-1); });
  nextBtn.addEventListener('click', function(){ goTo(current+1); });

  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'){ goTo(current+1); }
    else if(e.key==='ArrowLeft'){ goTo(current-1); }
  });

  // keep alignment on rotate / resize
  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ track.scrollLeft = current*track.clientWidth; }, 120);
  });

  render();
})();
</script>
</body>
</html>
